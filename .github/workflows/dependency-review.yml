name: dependency-review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      demo_note:
        description: "Demo note shown in manual run summary"
        required: false
        default: "Live demo manual run"
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Manual demo summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## Dependency Review Manual Demo"
            echo "- Event: workflow_dispatch"
            echo "- Note: ${{ inputs.demo_note }}"
            echo "- Purpose: Show workflow screen evidence during live demo"
            echo "- Production gate remains enforced on pull_request events"
          } >> "$GITHUB_STEP_SUMMARY"
