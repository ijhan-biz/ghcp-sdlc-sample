name: FieldOps Plan Change
description: BDD 시나리오 기반 기능 변경 계획을 등록합니다.
title: "[PLAN] "
labels: ["plan", "fieldops"]
body:
  - type: textarea
    id: business_outcome
    attributes:
      label: Business Outcome
      description: 이 변경으로 달성하려는 운영/비즈니스 목표
    validations:
      required: true

  - type: textarea
    id: bdd_scenario
    attributes:
      label: BDD Scenario (Given / When / Then)
      description: 최소 1개 이상의 시나리오를 작성하세요.
      placeholder: |
        Scenario: 우선순위 자동 상향
        Given 야간 시간대에 P2 장애가 접수되고 영향 가입자가 10,000명 이상일 때
        When 운영자가 장애 이슈를 등록하면
        Then 우선순위는 CRITICAL로 계산되어야 한다
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Leader question
        - 요구사항이 승인 가능한 작업 단위로 분해되었는가?

        ## Stop condition
        - AC, owner, rollback 조건이 없으면 개발 착수 금지

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: BDD 시나리오를 검증할 체크 항목
      placeholder: |
        - [ ] AC1
        - [ ] AC2
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner
      description: 계획 승인 및 개발 착수 책임자
      placeholder: "@team-lead"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 영향도
      options:
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: 롤백 조건
      description: 실패 시 되돌림 기준
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Non-goals
      description: 이번 변경에서 제외하는 범위
      placeholder: |
        - [ ] 기존 인시던트 UI 재설계는 제외
        - [ ] 데이터 마이그레이션은 제외
    validations:
      required: true
